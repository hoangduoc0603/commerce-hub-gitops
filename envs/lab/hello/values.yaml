# Values lab của hello cho chart app (platform/charts/app, mô tả từng key ở values.yaml của chart).
# ApplicationSet services-lab sinh app svc-hello từ file này (apps/lab/services.yaml). Namespace hello: infra/namespaces/.
# G0-22: image.digest và image.tag ghi tay (image của commit 16efc28, ticket G0-23). Từ G0-24, job update-gitops của hello
# sửa hai dòng này; đừng đổi cấu trúc hai key mà job đó tìm.
# G0-27: thêm DB (pg-main): bản sao mật khẩu hello_app, hello_migrator dạng SealedSecret, runtime qua Pooler, Job migrate.
# G0-29: issuer và JWKS của realm commerce-hub (env), thêm TRƯỚC khi merge image có resource server.
# G0-30: gửi span tới Collector (env), ServiceMonitor, deployment.environment.name; thêm TRƯỚC khi merge image bật export.
image:
  repository: ghcr.io/hoangduoc0603/commerce-hub-hello
  digest: sha256:b4b6fcc99c69bce5c909cb24b70d4d57457f4c2c13de817c78c5d04d26461bcd
  tag: "a8b8459e490443253a77908ca4840bef06134b4b"

# Lab chạy 1 replica cho mọi service (ADR-0004).
replicaCount: 1

resources:
  requests:
    cpu: 250m
    # Bằng limit (chart tự đặt). Đo ở G0-21: 129Mi working set lúc rảnh.
    memory: 512Mi

jvm:
  # Heap tối đa ~307Mi trong 512Mi; chốt lại sau khi đo RSS dưới tải (spec G0, values lab của hello).
  maxRAMPercentage: 60

env:
  SPRING_PROFILES_ACTIVE: "lab"
  # Runtime nối qua Pooler PgBouncer transaction (pg-main-pooler-rw), role hello_app chỉ có DML (G0-08, G0-26).
  # sslmode=require: mã hóa, KHÔNG kiểm chứng chỉ server; lệch chuẩn có chủ đích, verify-full ở G7 (ticket 27 Q4).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pg-main-pooler-rw.postgres.svc:5432/hello?sslmode=require"
  # Resource server (G0-29). Phải có trước khi image có JWT chạy: thiếu thì app dừng lúc khởi động
  # ("required a bean of type JwtDecoder"). Tên biến theo relaxed binding của Boot: bỏ dấu "-" (jwk-set-uri → JWKSETURI).
  # issuer: chép đúng trường issuer của discovery; JwtIssuerValidator so chuỗi chính xác, thừa "/" cuối là mọi token 401.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: "https://auth.lab.internal/realms/commerce-hub"
  # JWKS đi qua Gateway edge bằng HTTPS (truststore của chart), không đi địa chỉ nội bộ http://keycloak-service...:
  # lệch keycloak.md có chủ đích, lý do ở Q1 ticket G0-29 (tiêu chí PKIX cần HTTPS; khỏi mở NetworkPolicy của Keycloak).
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: "https://auth.lab.internal/realms/commerce-hub/protocol/openid-connect/certs"
  # Span qua OTLP HTTP tới Collector (G0-30). Service có internalTrafficPolicy: Local nên luôn vào Collector cùng node (G0-14);
  # Collector của node đó đang rollout thì request rơi và SDK thử lại. Thiếu biến này thì app không tạo exporter, span
  # không đi đâu và không có log báo (observability.md). Dùng property của Boot, không dùng OTEL_EXPORTER_OTLP_*
  # (observability.md: chart không đặt OTEL_* ngoài biến chủ ý).
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318/v1/traces"

# Ngoại lệ chỉ có ở G0: hello mở qua edge. Từ G1 chỉ seller-web, Keycloak, simulator ra ngoài.
httpRoute:
  enabled: true
  hostnames:
    - hello.lab.internal

# Prometheus scrape /actuator/prometheus trên cổng management (chart app 0.4.0, G0-30). Chu kỳ theo Prometheus (30 s).
serviceMonitor:
  enabled: true

# Thêm vào OTEL_RESOURCE_ATTRIBUTES của pod; service.version chart tự lấy từ image.tag (G0-30).
otel:
  resourceAttributes:
    deployment.environment.name: "lab"

# Tăng 1 trong cùng commit đổi sealedSecrets (chart app: annotation pod, để pod đọc Secret mới).
secretRevision: 1

# Bản sao mật khẩu hai role của hello, seal từ Secret pg-main-hello-* ở namespace postgres (G0-08). KHÔNG sửa tay.
# Sinh 2026-11-25 (G0-27 bước 4); lệnh sinh, đổi mật khẩu trong một commit: docs/runbooks/pg-main-them-service.md.
# Tên phải giữ nguyên: scope strict gắn tên và namespace hello vào bản mã.
sealedSecrets:
  hello-db-app:
    type: kubernetes.io/basic-auth
    encryptedData:
      password: 
      username: 
  # Hook PreSync wave -1: phải có trước Job migrate. Sync thành công thì bị xóa, credential migrate chỉ sống lúc sync.
  hello-db-migrator:
    type: kubernetes.io/basic-auth
    preSync: true
    encryptedData:
      password: 
      username: 

secretEnv:
  SPRING_DATASOURCE_USERNAME:
    secret: hello-db-app
    key: username
  SPRING_DATASOURCE_PASSWORD:
    secret: hello-db-app
    key: password

# Job migrate PreSync (chart app 0.3.0). Bật từ G0-27 bước 5: image có profile migrate (g0-26). Job lỗi thì sync dừng,
# Deployment giữ bản cũ.
migration:
  enabled: true
  env:
    # Nối THẲNG primary, không qua Pooler: Flyway cần advisory lock cấp session và SET (db-migration.md).
    SPRING_FLYWAY_URL: "jdbc:postgresql://pg-main-rw.postgres.svc:5432/hello?sslmode=require"
  secretEnv:
    SPRING_FLYWAY_USER:
      secret: hello-db-migrator
      key: username
    SPRING_FLYWAY_PASSWORD:
      secret: hello-db-migrator
      key: password
