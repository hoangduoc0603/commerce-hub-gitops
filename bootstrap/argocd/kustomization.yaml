apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Bản sao nguyên văn manifests/install.yaml của Argo CD v3.6.1 (sha256 7be23ca7…2913e), vendor vào repo
  # thay vì trỏ URL từ xa: repo-server không phải tải GitHub mỗi lần sinh manifest, tag git upstream có bị
  # dời cũng không đổi được cụm, và diff khi nâng cấp hiện trong commit. Nâng cấp: xem bootstrap/README.md.
  - upstream/install.yaml
patches:
  # Gỡ Dex và notifications-controller theo ADR-0004: SSO nối thẳng OIDC Keycloak (ticket G0-12),
  # chưa dùng notifications. Chọn theo nhãn để bản nâng cấp thêm resource mới cũng bị gỡ theo.
  # kind/name bên dưới chỉ là placeholder; target quyết định resource bị xóa.
  - target:
      labelSelector: app.kubernetes.io/component in (dex-server,notifications-controller)
    patch: |-
      $patch: delete
      kind: Any
      metadata:
        name: any
  # CRD của Argo CD không bao giờ bị app argocd prune: xóa CRD là Kubernetes xóa mọi Application,
  # AppProject, ApplicationSet trên cụm. Cùng lý do với Prune=false của namespace argocd.
  # name chỉ là placeholder; target chọn cả 3 CRD.
  # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  # Resource theo ngân sách ADR-0004
  - path: resources-patch.yaml
  # Cấu hình argocd-cm (url công khai, health check Lua cho Application)
  - path: argocd-cm-patch.yaml
  # argocd-server phục vụ HTTP sau Gateway edge (server.insecure), chỉ nhận traffic từ Envoy (G0-06)
  - path: argocd-cmd-params-cm-patch.yaml
  - path: argocd-server-netpol-patch.yaml
