# Resource của Argo CD trên home lab.
# Memory theo bảng ngân sách G0–G1 (ADR-0004, docs/.scratch/architecture-g0-g1/issues/04-resource-budget.md#answer):
# memory request = limit (docs/standards/helm-chart.md); không đặt CPU limit để tránh throttling.
# CPU request là ước lượng ban đầu, chỉnh theo số đo `kubectl top` ở ticket G0-03 bước 5.
# Init container đặt bằng container chính cùng pod: request hiệu lực của pod là
# max(init lớn nhất, tổng container chính), nên không tốn thêm ngân sách.
#
# GOMEMLIMIT ≈ 90% memory limit cho mọi thành phần viết bằng Go (Redis thì không). Không có nó, Go runtime
# không biết trần của container: chỉ gom rác theo GOGC=100 và giữ lại bộ nhớ đã gom, nên working set có thể
# chạm limit và bị OOMKilled dù dữ liệu sống còn ít (G0-03 bước 8: controller 451Mi working set nhưng
# heap_alloc chỉ 131MiB). Chừa ~10% cho phần ngoài heap Go quản lý không hết (stack, cgo, page cache).
# ĐỔI LIMIT THÌ ĐỔI LUÔN GOMEMLIMIT. https://go.dev/doc/gc-guide#Memory_limit
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          env:
            - name: GOMEMLIMIT
              value: 460MiB
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      initContainers:
        - name: copyutil
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
      containers:
        - name: argocd-repo-server
          env:
            - name: GOMEMLIMIT
              value: 230MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          env:
            - name: GOMEMLIMIT
              value: 115MiB
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      initContainers:
        - name: secret-init
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          env:
            - name: GOMEMLIMIT
              value: 58MiB
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
