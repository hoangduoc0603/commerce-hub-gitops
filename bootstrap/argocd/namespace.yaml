apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    # Pod Security Admission: từ chối pod vi phạm profile restricted (root, hostPath, privileged…)
    # trong namespace giữ quyền admin của cụm. Mọi pod của install.yaml v3.6.1 đã đạt restricted
    # (thử bằng `kubectl label --dry-run=server`, ticket G0-03 bước 5). Ghim version theo bản
    # Kubernetes để quy tắc không tự đổi khi nâng cụm.
    # https://kubernetes.io/docs/concepts/security/pod-security-admission/
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
