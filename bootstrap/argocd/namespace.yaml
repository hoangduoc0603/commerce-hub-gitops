apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    # App argocd bật prune: lỡ xóa file này khỏi kustomization thì Argo CD sẽ xóa namespace của chính nó.
    # Prune=false giữ namespace lại, app chỉ báo OutOfSync.
    # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    # Pod Security Admission: từ chối pod vi phạm profile restricted (root, hostPath, privileged…)
    # trong namespace giữ quyền admin của cụm. Mọi pod của install.yaml v3.6.1 đã đạt restricted
    # (thử bằng `kubectl label --dry-run=server`, ticket G0-03 bước 5). Ghim version theo bản
    # Kubernetes để quy tắc không tự đổi khi nâng cụm.
    # https://kubernetes.io/docs/concepts/security/pod-security-admission/
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    # Cho phép gắn HTTPRoute vào listener https của Gateway edge (route argocd.lab.internal ở infra/edge/, G0-06).
    # Chỉ platform gắn nhãn này (docs/standards/cluster-entry.md).
    edge.lab.internal/routes: "true"
