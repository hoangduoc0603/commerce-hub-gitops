# Namespace của toàn bộ thành phần quan sát (G0-13, G0-14): Prometheus Operator, Prometheus, Alertmanager,
# kube-state-metrics, node-exporter, Grafana, Loki, Tempo, OTel Collector.
# Do platform tạo, app không dùng CreateNamespace.
# - Pod Security privileged (lệch có chủ đích so với restricted của edge, cert-manager, keycloak): node-exporter cần
#   hostNetwork, hostPID và hostPath / để đọc /proc, /sys của node; OTel Collector (G0-14) chạy root với hostPath
#   /var/log/pods và /var/lib/otelcol (checkpoint log). Đều vượt mức baseline. Loại: tách hai DaemonSet ra namespace
#   riêng (ticket ghi mọi thành phần ở observability).
#   https://kubernetes.io/docs/concepts/security/pod-security-standards/
# - edge.lab.internal/routes: cho HTTPRoute grafana.lab.internal gắn vào listener https của Gateway edge (bước 5).
# - Prune=false,Delete=false: commit lỡ không xóa namespace, và xóa app (có finalizer cascade) cũng không xóa namespace;
#   xóa namespace là mất PVC dữ liệu Prometheus, PVC do StatefulSet sinh nên Argo CD không theo dõi để gắn Delete=false
#   (gitops-argocd.md: tài nguyên giữ dữ liệu có Delete=false; như infra/pg-main/namespace.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37
    edge.lab.internal/routes: "true"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
