# Tài khoản admin cục bộ của Grafana (G0-13 bước 5; SSO qua Keycloak Hoãn tới G7). Key admin-user, admin-password
# đúng tên mặc định của admin.existingSecret trong chart grafana 14.6.1. Mật khẩu 192 bit ngẫu nhiên dạng hex, sinh ngày
# 2026-11-27 và pipe thẳng sang kubeseal, không chạm đĩa. Lấy ra để đăng nhập:
#   kubectl -n observability get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
# Xoay: seal lại file này rồi restart Deployment kube-prometheus-stack-grafana (Grafana không có PVC, DB SQLite tạo
# lại mỗi lần khởi động nên nhận mật khẩu mới từ env). KHÔNG sửa tay; scope strict.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    # Wave -1 theo docs/runbooks/sealing-key.md: Secret có trước Deployment Grafana đọc nó.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: observability
