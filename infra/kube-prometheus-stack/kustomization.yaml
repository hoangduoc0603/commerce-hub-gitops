# Phần Git của app kube-prometheus-stack (G0-13): namespace, CRD vendor; các bước sau thêm SealedSecret Grafana,
# HTTPRoute, PrometheusRule, dashboard. Chuẩn: docs/standards/observability.md, gitops-argocd.md.
# Không đặt `namespace:` ở đây: CRD là tài nguyên cluster-scoped; object có namespace tự khai trong file của nó.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # Recording rule và alert ngân sách series (G0-13 bước 4).
  - prometheusrule-series-budget.yaml
  # Grafana (G0-13 bước 5): mật khẩu admin (wave -1) và route grafana.lab.internal.
  - grafana-admin.sealedsecret.yaml
  - grafana-httproute.yaml
  # Bản sao nguyên văn example/prometheus-operator-crd/ của prometheus-operator v0.95.2 (appVersion của chart 94.1.0;
  # giống hệt charts/crds/crds/ của chart trừ dòng comment đầu), tải 2026-11-27 từ
  # https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.95.2/example/prometheus-operator-crd/
  # Không cài từ chart (crds.enabled: false) vì thư mục crds/ của Helm không render template, không gắn được annotation
  # bảo vệ bên dưới.
  # NÂNG CẤP: tải lại cả 10 file theo tag operator mới (appVersion của chart), xem diff, sửa sha256, cùng commit với
  # targetRevision chart và digest image trong apps/lab/kube-prometheus-stack.yaml.
  # sha256 3f6b3c73566a685a1e120a28bb9b43063dc5c4e266793975eea514c1d47343b2
  - upstream/monitoring.coreos.com_alertmanagerconfigs.yaml
  # sha256 d2ab3812890bac38c96604e965defb49ea2c553cf2d57aa705864f3bd4e9d5e6
  - upstream/monitoring.coreos.com_alertmanagers.yaml
  # sha256 29d555a01b8559d560376ecefc1bf84a15eca3066bf97020f81d87c552709cf6
  - upstream/monitoring.coreos.com_podmonitors.yaml
  # sha256 574521ccf082d0f2860e025b26a6e363bc404303831ddb7f023fd74ed5de2ebf
  - upstream/monitoring.coreos.com_probes.yaml
  # sha256 e8d2376d2cada640a0ee233a98cb44d1d485eec9383fc1bfdbe19690ad815c13
  - upstream/monitoring.coreos.com_prometheusagents.yaml
  # sha256 7d136444c639237f1f626ff9353ad97edda8e4413b954f8a1591048faff6d4b8
  - upstream/monitoring.coreos.com_prometheuses.yaml
  # sha256 76c6ed5e3e4fb1fd500506e21d33c6753e912e4380aef8f29960702d59ec81eb
  - upstream/monitoring.coreos.com_prometheusrules.yaml
  # sha256 402569d5d6c94f06caff7b9d3f1f0d8034eec5d0feb3432f1f18a14c4d7ad02e
  - upstream/monitoring.coreos.com_scrapeconfigs.yaml
  # sha256 373fabaf6f5b68c5a155fa94486d4e8a2863c4aa6478b066a62d0767cd86ab1f
  - upstream/monitoring.coreos.com_servicemonitors.yaml
  # sha256 8ca5b632b73ab9aa848f95875d56502a469d83446f8d1c525c7ea0c2eb934a68
  - upstream/monitoring.coreos.com_thanosrulers.yaml
patches:
  # Xóa CRD là xóa mọi CR của nó: CR Prometheus mất thì operator gỡ StatefulSet, mất giám sát; ServiceMonitor,
  # PrometheusRule mất theo. Prune=false chặn commit lỡ; Delete=false chặn cascade khi xóa app.
  # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
# Dashboard dạng code (G0-13 bước 6). Sidecar grafana-sc-dashboard theo dõi ConfigMap mang nhãn grafana_dashboard=1 trong
# observability, ghi từng key thành file /tmp/dashboards/<key> rồi gọi API reload provisioning của Grafana. Provider của
# kube-prometheus-stack đặt allowUiUpdates: false: dashboard từ file không lưu được trên UI. Grafana không có PVC, nên
# bản "Save as" trên UI mất khi pod khởi động lại; nguồn duy nhất là file JSON ở đây.
# Cách sửa: dựng hoặc sửa trên UI cho tiện, Export → "Export as JSON" (bỏ chọn "Export for sharing externally"), chép đè
# file trong dashboards/, giữ uid.
configMapGenerator:
  - name: grafana-dashboard-cardinality
    namespace: observability
    files:
      - dashboards/cardinality.json
    options:
      labels:
        grafana_dashboard: "1"
      # Wave -1 theo gitops-argocd.md mục "Sync waves" (ConfigMap trước workload). Sidecar nạp động nên không bắt buộc.
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      # Tắt hậu tố hash: đổi JSON thì Argo CD tạo ConfigMap tên mới rồi mới prune cái cũ. Hai ConfigMap cùng key
      # cardinality.json, nên sự kiện DELETED của cái cũ làm sidecar XÓA file vừa ghi, dashboard biến mất. Sidecar tự
      # thấy nội dung đổi, không cần đổi tên để kéo rollout.
      disableNameSuffixHash: true
  # RED, JVM, Hikari của một service, chọn bằng biến service (G0-30 bước 10). Cùng cách nạp với Cardinality.
  - name: grafana-dashboard-service-overview
    namespace: observability
    files:
      - dashboards/service-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      # Cùng lý do với Cardinality ở trên.
      disableNameSuffixHash: true
