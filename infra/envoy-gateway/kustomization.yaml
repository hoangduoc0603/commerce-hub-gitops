apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # CRD riêng của Envoy Gateway v1.10.0 (EnvoyProxy, ClientTrafficPolicy, BackendTrafficPolicy, SecurityPolicy…), sinh
  # bằng `helm template eg-crds oci://docker.io/envoyproxy/gateway-crds-helm --version v1.10.0
  #   --set crds.envoyGateway.enabled=true --set crds.gatewayAPI.enabled=false` (chart digest sha256 475c39aa…,
  # file sha256 4270cb46…, 2026-11-14). Không cài từ gateway-helm vì crds.enabled=false của chart đó tắt cả nhóm CRD
  # này (subchart `crds` gộp CRD Envoy Gateway với CRD Gateway API). Vendor thay vì để Argo CD render chart, để gắn được
  # annotation bảo vệ bên dưới (chart không có value cho annotation của CRD).
  # NÂNG CẤP: render lại bằng lệnh trên với version mới, xem diff, sửa sha256, cùng commit nâng gateway-helm.
  - upstream/envoy-gateway-crds.yaml
patches:
  # Xóa CRD là xóa mọi CR của nó: EnvoyProxy `envoy` mất thì Envoy bị dựng lại với mặc định (512Mi, không có IP
  # 10.20.0.200), mọi hostname của lab đổi IP. Prune=false chặn commit lỡ; Delete=false chặn cascade khi xóa app.
  # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
