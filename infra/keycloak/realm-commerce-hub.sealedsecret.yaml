# Secret được thay vào realm/commerce-hub.yaml qua $(env:…) khi Job keycloak-config-cli chạy (envFrom).
# - SMOKE_TEST_CLIENT_SECRET: secret của client smoke-test (client credentials). Cũng là secret của repo e2e (ticket 31):
#   lấy bằng `kubectl -n keycloak get secret realm-commerce-hub -o jsonpath='{.data.SMOKE_TEST_CLIENT_SECRET}' | base64 -d`.
# 256 bit ngẫu nhiên dạng hex, sinh ngày 2026-11-27 (G0-11), pipe thẳng sang kubeseal. KHÔNG sửa tay; scope strict.
# Xoay secret: seal lại file này rồi sync; Job ghi secret mới vào client.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: realm-commerce-hub
  namespace: keycloak
spec:
  encryptedData:
    SMOKE_TEST_CLIENT_SECRET: 
  template:
    metadata:
      name: realm-commerce-hub
      namespace: keycloak
