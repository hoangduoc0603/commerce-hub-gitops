# CR Keycloak: 1 instance Keycloak 26.8.2 chế độ production (lệnh start), DB keycloak trên pg-main. Ticket G0-10 bước 3.
# Chuẩn: docs/standards/keycloak.md mục "Cài trên Kubernetes bằng Operator", "Database", "Hostname, TLS, reverse proxy".
# API: CRD keycloaks.k8s.keycloak.org bản v2beta1 (storage) trong infra/keycloak-operator/upstream/.
# Operator dựng: StatefulSet keycloak (pod keycloak-0), Service keycloak-service (8080 http, 9000 management),
# Service keycloak-discovery (JGroups), NetworkPolicy keycloak-network-policy, Secret keycloak-initial-admin.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  # Lệch chuẩn có chủ đích (ADR-0004, keycloak.md mục lệch chuẩn): production cần ≥ 2. Mỗi lần đổi image là downtime
  # đăng nhập; token đã cấp vẫn dùng được tới khi hết hạn.
  instances: 1

  # Image chính thức (image tùy biến có theme, passwordBlacklist: Hoãn tới G1). Ghim digest vì tag 26.8.2 đã bị đẩy lại
  # trên quay.io (c68e286c… dùng 2026-11-12 → 2026-11-19). Image index đa kiến trúc, user 1000.
  # NÂNG CẤP: đổi cùng commit với bản operator (infra/keycloak-operator/), một Operator chạy đúng một bản Keycloak.
  image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
  # Bắt buộc khi đặt spec.image với image chưa `kc.sh build`: bỏ trống thì operator coi image là tùy biến đã tối ưu và chạy
  # `start --optimized` (mô tả trường startOptimized trong CRD 26.8.2). false: start tự build lại option db=postgres,
  # health-enabled lúc khởi động (chậm hơn vài chục giây, log "Updating the configuration").
  startOptimized: false

  db:
    vendor: postgres
    # Nối thẳng pg-main-rw, không qua Pooler: Keycloak có pool Agroal riêng (G0-08 quyết định C). sslmode=require để khớp
    # dòng hostssl của pg_hba; mã hóa nhưng không kiểm chứng chỉ server (verify-full ở G7, như hello, ticket 27 Q4).
    url: jdbc:postgresql://pg-main-rw.postgres.svc:5432/keycloak?sslmode=require
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
    # Hạ từ mặc định 100 (keycloak.md mục Database). Bằng connectionLimit 20 của role keycloak (infra/pg-main/keycloak.yaml);
    # lên 2 pod thì xét lại ngân sách kết nối của pg-main.
    poolMaxSize: 20

  hostname:
    # URL đầy đủ: mọi URL Keycloak sinh cho trình duyệt (kể cả iss của token) là https://auth.lab.internal, không đọc từ
    # header của request. https vì client chỉ thấy edge (kết thúc TLS), dù Keycloak nghe HTTP.
    hostname: https://auth.lab.internal
    # Admin Console chỉ vào bằng `kubectl port-forward svc/keycloak-service 8180:8080` (hostname kc-admin.: Hoãn tới G7).
    # Thiếu dòng này thì /admin/ chuyển hướng về https://auth.lab.internal/admin/… (đo 2026-11-26), đường bị edge chặn.
    # Chưa đủ một mình: trang đăng nhập của Admin Console theo URL FRONTEND, nên realm master còn có attribute
    # frontendUrl=http://localhost:8180 (đặt tay bằng kcadm, docs/runbooks/keycloak-admin.md).
    # 8180 thay vì 8080: Spring Boot trên Mac (hello bootTestRun) giữ 8080. Đổi cổng thì đổi cả frontendUrl của master
    # và lệnh trong runbook.
    admin: http://localhost:8180
    # Hai dòng dưới là mặc định, ghi ra để đọc file là thấy chính sách (keycloak.md).
    strict: true
    backchannelDynamic: false

  http:
    # edge kết thúc TLS và nói HTTP tới 8080 (lệch chuẩn, re-encrypt bằng BackendTLSPolicy Hoãn tới G7). Không có
    # tlsSecret nên Service chỉ có cổng http.
    httpEnabled: true

  proxy:
    # Đọc X-Forwarded-For/-Proto/-Host do Envoy gửi. Envoy mặc định NỐI THÊM vào X-Forwarded-For thay vì ghi đè; bước 6
    # đo và sửa. Không đặt trường này thì operator rơi về proxy=passthrough đã deprecated.
    headers: xforwarded

  # Cổng 8080 (HTTP) chỉ nhận từ pod Envoy của Gateway edge và pod trong namespace keycloak; trước đó operator để mở cho
  # mọi nguồn (luật không có `from`): đo 2026-11-27, pod ở namespace default đọc được /realms/master qua
  # keycloak-service:8080 (200), tức vượt route của edge và vượt ClientTrafficPolicy (G0-10 bước 7).
  # Cổng 9000 (management): giữ mặc định tới ticket 13 (chỉ namespace observability). JGroups 7800: operator tự giới hạn.
  # kubectl port-forward không đi qua NetworkPolicy.
  networkPolicy:
    enabled: true
    http:
      # Hai selector trong CÙNG một phần tử là AND: pod mang nhãn này VÀ ở namespace envoy-gateway-system.
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: edge
            gateway.envoyproxy.io/owning-gateway-namespace: edge
      # Pod cùng namespace keycloak: Job keycloak-config-cli (ticket 11) gọi admin API qua keycloak-service:8080, vì admin
      # API không mở qua edge. Service nào cần jwk-set-uri nội bộ thì thêm namespace của nó ở đây.
      - podSelector: {}

  additionalOptions:
    # Chỉ đọc X-Forwarded-* khi kết nối đến từ dải pod (IP pool default-ipv4-ippool của Calico). IP pod Envoy thay đổi nên
    # không ghim được một IP; NetworkPolicy ở trên mới là ranh giới thật (docs Keycloak: "weak protection", phải kèm cô lập
    # mạng). Request qua port-forward đến từ 127.0.0.1, không thuộc dải, nên header của nó bị bỏ qua (trước: tin, đo
    # 2026-11-27 event ghi 6.6.6.6).
    - name: proxy-trusted-addresses
      value: 10.244.0.0/16
    # Cổng 9000 (management): /metrics. Option lúc build: với startOptimized false, start tự build lại (G1 chuyển vào
    # Containerfile của image tùy biến). health-enabled operator luôn bật (Constants.DEFAULT_DIST_CONFIG_LIST).
    # Chuẩn: keycloak.md mục "Giám sát". ServiceMonitor và giới hạn 9000 cho namespace observability: ticket 13.
    - name: metrics-enabled
      value: "true"
    # keycloak_user_events_total{realm,event,error}: đăng nhập, đăng nhập sai, refresh… Tag mặc định chỉ realm (thêm
    # clientId/idp làm tăng số series). Feature user-event-metrics bật sẵn (Profile.java 26.8.2: Type.DEFAULT).
    - name: event-metrics-user-enabled
      value: "true"
    # Histogram http_server_requests_seconds để tính p95/p99 (mặc định chỉ có count và sum).
    - name: http-metrics-histograms-enabled
      value: "true"
    # Quá tải thì 503 ngay thay vì xếp hàng vô hạn (mặc định không giới hạn; production guide). 100 ≈ 7 s chờ ở 1 vCPU
    # (sizing: ~15 đăng nhập mật khẩu/s/vCPU), dưới timeout thường gặp của client. Giá trị khởi đầu, chốt bằng k6 (bảng
    # "Tài nguyên" của keycloak.md).
    - name: http-max-queued-requests
      value: "100"

  # Cửa vào là HTTPRoute trên Gateway edge (bước 5), không phải Ingress do operator tạo.
  ingress:
    enabled: false

  # update.strategy: giữ mặc định RecreateOnImageChange (lệch keycloak.md, chốt khi duyệt lộ trình): 1 instance thì rolling
  # update vẫn có downtime, còn Auto chạy thêm một Job bằng image Keycloak để so tương thích, tốn RAM mà không được gì.

  resources:
    # Request = limit memory 1,5 Gi (keycloak.md, lệch chuẩn có chủ đích: hướng dẫn container khuyên 2 GB). Heap mặc định
    # 70% limit (~1 075 Mi). Không CPU limit (tránh throttle lúc khởi động có build lại); request 500m.
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      memory: 1536Mi

  unsupported:
    # Operator 26.8.2 không đặt securityContext nào cho pod Keycloak (KeycloakDeploymentDependentResource.java), nên PSA
    # restricted của namespace keycloak sẽ từ chối pod. Operator lấy podTemplate này làm khung rồi chỉ sửa container đầu
    # (name, image, args, env, port, probe), nên các trường dưới được giữ. "unsupported": docs ghi không được hỗ trợ chính
    # thức; kiểm lại khi nâng operator.
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: keycloak
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
