# Secret của client keycloak-config-cli trong realm master: Job keycloak-config-cli đăng nhập bằng client credentials.
# 256 bit ngẫu nhiên dạng hex, sinh ngày 2026-11-27 (G0-11) và pipe thẳng sang kubeseal, không chạm đĩa. Keycloak nhận
# cùng giá trị qua scripts/bootstrap-keycloak-config-cli.sh (đọc Secret này trong cụm). KHÔNG sửa tay; scope strict.
# Xoay secret: seal lại file này, sync, rồi chạy lại script bootstrap (runbook docs/runbooks/keycloak-admin.md).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-config-cli
  namespace: keycloak
spec:
  encryptedData:
    KEYCLOAK_CLIENTSECRET: 
  template:
    metadata:
      name: keycloak-config-cli
      namespace: keycloak
