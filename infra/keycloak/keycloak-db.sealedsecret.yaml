# Bản sao mật khẩu role keycloak cho CR Keycloak (spec.db.usernameSecret/passwordSecret chỉ đọc Secret cùng namespace).
# Seal từ Secret pg-main-keycloak (namespace postgres) ngày 2026-11-26 (G0-10 bước 2). KHÔNG sửa tay; scope strict gắn
# tên keycloak-db và namespace keycloak vào bản mã. Đổi mật khẩu: seal lại cả hai bản trong một commit
# (docs/runbooks/pg-main-them-service.md mục "Đổi mật khẩu").
# - Không chép nhãn cnpg.io/reload: nhãn đó dành cho operator CloudNativePG ở namespace postgres.
# - Wave -1: Secret có trước CR Keycloak (wave 0), theo docs/runbooks/sealing-key.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: keycloak-db
      namespace: keycloak
    type: kubernetes.io/basic-auth
