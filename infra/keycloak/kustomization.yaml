# Keycloak 26.8.2 (CR của Keycloak Operator, app keycloak-operator). Ticket G0-10, G0-11.
# Chuẩn: docs/standards/keycloak.md, docs/standards/cluster-entry.md mục "Keycloak qua Gateway".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ép mọi object vào namespace keycloak (namespace do app keycloak-operator tạo).
namespace: keycloak
resources:
  # Thông tin DB: role keycloak trên pg-main (infra/pg-main/keycloak.yaml), bản sao seal lại cho namespace này.
  - keycloak-db.sealedsecret.yaml
  # CR Keycloak (G0-10 bước 3). Wave mặc định 0: sau SealedSecret keycloak-db (-1).
  - keycloak.yaml
  # Route công khai qua Gateway edge (G0-10 bước 5).
  - httproute.yaml
  # Realm dạng code (G0-11): secret cho Job keycloak-config-cli (hook PostSync, chạy sau khi CR Keycloak Ready).
  - keycloak-config-cli.sealedsecret.yaml
  - realm-commerce-hub.sealedsecret.yaml
  - keycloak-config-cli.yaml
generatorOptions:
  annotations:
    # Wave -1 cho ConfigMap (docs/standards/gitops-argocd.md mục "Sync waves").
    argocd.argoproj.io/sync-wave: "-1"
configMapGenerator:
  # File realm cho Job keycloak-config-cli. Hậu tố hash: sửa file realm là đổi tên ConfigMap, app OutOfSync, auto-sync
  # chạy lại Job. ConfigMap cũ bị prune.
  - name: realm-commerce-hub
    files:
      - realm/commerce-hub.yaml
