apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # Bản sao nguyên văn asset cert-manager.crds.yaml của release v1.21.3 (6 CRD; sha256 29810b2a…8700f2749, tải
  # 2026-11-15). Không cài từ chart (crds.enabled=false) vì chart không cho gắn annotation bảo vệ bên dưới; annotation
  # helm.sh/resource-policy: keep có sẵn trong file chỉ có tác dụng với `helm uninstall`, Argo CD không đọc nó.
  # NÂNG CẤP: tải asset của tag mới, xem diff, sửa sha256, cùng commit với targetRevision chart và digest image.
  - upstream/cert-manager.crds.yaml
patches:
  # Xóa CRD là xóa mọi Certificate, Issuer, ClusterIssuer; Secret chứng chỉ còn lại nhưng không ai gia hạn, và
  # Gateway edge hết hạn chứng chỉ sau 90 ngày. Prune=false chặn commit lỡ; Delete=false chặn cascade khi xóa app.
  # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
