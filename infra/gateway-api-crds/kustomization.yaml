apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Bản sao nguyên văn standard-install.yaml của Gateway API v1.6.1 (standard channel), tải từ
  # https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  # sha256 24d931f22abd8e40c973264319ead7cfa09d0fb7716b7ab1ee2ff174cb063a73 (2026-11-14). Gồm 10 CRD và
  # ValidatingAdmissionPolicy safe-upgrades.gateway.networking.k8s.io (chặn cài đè CRD experimental hoặc bản < v1.5).
  # Trùng byte với phần standard của gateway-crds-helm v1.10.0 (Envoy Gateway đóng gói lại cùng bản này).
  # Tách khỏi Envoy Gateway: CRD là API chuẩn, cert-manager (G0-06) cũng đọc; đổi implementation không đụng tới đây.
  # NÂNG CẤP: đọc bảng matrix của Envoy Gateway trước (EG yêu cầu nâng CRD trước khi nâng EG), vendor lại file
  # từ tag mới, xem diff, sửa sha256 ở trên.
  - upstream/standard-install.yaml
patches:
  # CRD này giữ dữ liệu: xóa CRD là Kubernetes xóa mọi Gateway, HTTPRoute, BackendTLSPolicy của mọi namespace,
  # tức là mọi hostname của lab mất cùng lúc.
  # - Prune=false: commit lỡ làm CRD biến khỏi manifest không xóa CRD.
  # - Delete=false: xóa app gateway-api-crds (có finalizer) không cascade xóa CRD.
  # Gỡ thật thì admin `kubectl delete crd` có chủ ý.
  # https://argo-cd.readthedocs.io/en/release-3.6/user-guide/sync-options/#no-prune-resources
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
