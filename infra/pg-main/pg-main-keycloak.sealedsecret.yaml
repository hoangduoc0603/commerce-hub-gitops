# Mật khẩu role keycloak trên pg-main (Secret kubernetes.io/basic-auth, username trùng tên role), DatabaseRole keycloak
# đọc qua passwordSecret. KHÔNG sửa tay. Sinh ngày 2026-11-15 (G0-08 bước 7), 256 bit ngẫu nhiên dạng hex, không chạm
# đĩa; cùng lệnh với pg-main-hello-app.sealedsecret.yaml, đổi tên:
#   openssl rand -hex 32 | tr -d '\n' | kubectl create secret generic pg-main-keycloak -n postgres \
#     --type=kubernetes.io/basic-auth --from-literal=username=keycloak --from-file=password=/dev/stdin \
#     --dry-run=client -o yaml | kubectl label --local -f - cnpg.io/reload=true -o yaml | kubeseal --format yaml
# - Wave 1: sau Cluster (0), trước DatabaseRole keycloak (2).
# - Bản sao cho namespace keycloak (spec.db.usernameSecret/passwordSecret của CR Keycloak, ticket 10) seal từ Secret
#   trong cụm, không ghi plaintext ra đĩa. Đổi mật khẩu: chạy lại lệnh trên, ghi đè file này và seal lại bản sao ở
#   namespace keycloak trong cùng commit. Runbook: docs/runbooks/pg-main-them-service.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pg-main-keycloak
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: pg-main-keycloak
      namespace: postgres
    type: kubernetes.io/basic-auth
