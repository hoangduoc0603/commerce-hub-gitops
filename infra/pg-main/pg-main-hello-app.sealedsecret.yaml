# Mật khẩu role hello_app trên pg-main (Secret kubernetes.io/basic-auth, username trùng tên role), DatabaseRole
# hello-app đọc qua passwordSecret. KHÔNG sửa tay. Sinh ngày 2026-11-15 (G0-08 bước 4), 256 bit ngẫu nhiên dạng hex
# (không ký tự đặc biệt, khỏi escape trong URL JDBC), không chạm đĩa:
#   openssl rand -hex 32 | tr -d '\n' | kubectl create secret generic pg-main-hello-app -n postgres \
#     --type=kubernetes.io/basic-auth --from-literal=username=hello_app --from-file=password=/dev/stdin \
#     --dry-run=client -o yaml | kubectl label --local -f - cnpg.io/reload=true -o yaml | kubeseal --format yaml
# - Nhãn cnpg.io/reload nằm ở spec.template.metadata.labels (kubeseal chép metadata của Secret đầu vào vào template):
#   đổi mật khẩu thì operator áp ngay, không chờ lần reconcile sau (docs CNPG Password management).
# - Wave 1: sau Cluster (0), trước role LOGIN (2).
# - Plaintext không được lưu ở đâu ngoài Secret trong cụm. Bản sao cho namespace service (G0-27) seal từ Secret đó:
#   kubectl get secret -n postgres <tên> -o yaml | (đổi namespace, bỏ metadata thừa) | kubeseal, không ghi ra đĩa.
# - Đổi mật khẩu: chạy lại lệnh trên rồi ghi đè file, và seal lại bản sao ở namespace service trong cùng commit.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pg-main-hello-app
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: pg-main-hello-app
      namespace: postgres
    type: kubernetes.io/basic-auth
