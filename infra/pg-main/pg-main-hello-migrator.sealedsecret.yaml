# Mật khẩu role hello_migrator trên pg-main (Secret kubernetes.io/basic-auth, username trùng tên role, nhãn cnpg.io/reload ở
# template), DatabaseRole đọc qua passwordSecret. KHÔNG sửa tay. Sinh ngày 2026-11-15 (G0-08 bước 4): 256 bit hex,
# pipe thẳng vào kubeseal, plaintext không chạm đĩa. Wave 1: sau Cluster (0), trước role LOGIN (2).
# Lệnh sinh, đưa bản sao sang namespace service, đổi mật khẩu: docs/runbooks/pg-main-them-service.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pg-main-hello-migrator
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      labels:
        cnpg.io/reload: "true"
      name: pg-main-hello-migrator
      namespace: postgres
    type: kubernetes.io/basic-auth
