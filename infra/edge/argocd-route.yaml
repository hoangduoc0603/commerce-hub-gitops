# Argo CD qua Gateway edge: https://argocd.lab.internal (G0-06). Route của thành phần hạ tầng thuộc platform, nằm ở
# app edge (wave 5) thay vì bootstrap/argocd: lệnh bootstrap 1 chạy khi CRD HTTPRoute (wave 2) chưa có.
# - Cổng 80 của Service argocd-server (→ 8080, HTTP thường nhờ server.insecure). Một route phục vụ cả UI lẫn CLI:
#   CLI dùng `--grpc-web` (gRPC bọc trong HTTP/1.1); gRPC thuần cần thêm GRPCRoute với appProtocol h2c, chưa cần.
# - Namespace argocd mang nhãn edge.lab.internal/routes (bootstrap/argocd/namespace.yaml).
# https://argo-cd.readthedocs.io/en/release-3.6/operator-manual/ingress/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: edge
      namespace: edge
      sectionName: https
  hostnames:
    - argocd.lab.internal
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      # Tắt timeout request (mặc định Envoy 15 s) cho cả route: UI giữ stream dài (/api/v1/stream/…, log, terminal) và
      # CLI --grpc-web cũng stream (app wait, logs -f) qua nhiều đường dẫn REST lẫn gRPC; liệt kê từng path thì dễ sót.
      # Kết nối treo vẫn bị cắt bởi idle timeout của Envoy. Gateway API: giá trị 0 "SHOULD disable the timeout
      # completely". https://gateway.envoyproxy.io/docs/tasks/traffic/http-timeouts/ (review G0-06)
      timeouts:
        request: "0s"
      filters:
        # HSTS: argocd-server chạy server.insecure nên cookie argocd.token của đăng nhập local KHÔNG có cờ Secure
        # (server/server.go@v3.6.1 gọi SetTokenCookie(..., !server.Insecure)). Không có HSTS, trình duyệt gửi cookie đó
        # qua http:// trước khi nhận 301. HSTS buộc trình duyệt tự đổi sang https từ lần thứ hai (review G0-06).
        # 1 năm, không includeSubDomains/preload: tên nội bộ, chỉ áp cho đúng host này.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
