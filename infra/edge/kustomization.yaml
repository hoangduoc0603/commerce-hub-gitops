# Cửa vào cụm (ADR-0013): GatewayClass, EnvoyProxy, namespace edge, Gateway edge và route chuyển HTTP sang HTTPS.
# Chỉ project platform tạo các Kind này; service chỉ viết HTTPRoute gắn vào listener https của edge (mô hình vai trò
# của Gateway API).
# Chuẩn: docs/standards/cluster-entry.md mục "Gateway API CRD và Envoy Gateway", "Gateway edge và sở hữu".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - http-redirect.yaml
  - argocd-route.yaml
