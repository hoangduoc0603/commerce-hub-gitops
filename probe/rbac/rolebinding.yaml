# TẠM (G0-03 bước 12): project commerce phải từ chối RoleBinding, kể cả trong namespace được phép.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-escalate
  namespace: hello
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: hello
