# TẠM (ticket G0-03 bước 8–9, gỡ ở bước 11). Wave 1: pod Ready sau 60 giây; root phải chờ app này
# Healthy (health check Lua cho Application trong argocd-cm) rồi mới tạo sandbox-fast ở wave 2.
# Có finalizer như mọi app con: xóa app là dọn sạch namespace sandbox.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-slow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
    targetRevision: main
    path: sandbox/slow
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
