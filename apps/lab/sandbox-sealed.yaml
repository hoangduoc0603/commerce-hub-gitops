# App thử của G0-04 (bước 4–8): SealedSecret thử trong namespace sandbox. Gỡ ở bước 9.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-sealed
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
    targetRevision: main
    path: sandbox/sealed
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
