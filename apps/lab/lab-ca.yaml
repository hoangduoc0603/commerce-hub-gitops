# PKI của lab trong cụm: SealedSecret lab-intermediate-ca và ClusterIssuer lab-ca (G0-06); ConfigMap root lab và Bundle
# lab-trust, lab-root của trust-manager (G0-07). Mã nguồn ở infra/lab-ca/.
# Chuẩn: docs/standards/cluster-entry.md mục "PKI và cert-manager", ADR-0014.
#
# - App riêng thay vì gộp vào cert-manager hay edge: PKI có vòng đời riêng (xoay intermediate 2 năm một lần) và health
#   riêng; ClusterIssuer cũng không tạo được cùng lần sync cài CRD của nó.
# - Wave 5, cùng app edge: sau cert-manager (3, CRD và webhook), trust-manager (4, CRD Bundle) và Sealed Secrets (1).
#   Gateway edge tham chiếu lab-ca bằng annotation; nếu issuer Ready sau Gateway vài giây thì cert-manager tự thử lại.
# - Argo CD v3.6.1 có sẵn health check cho cert-manager.io ClusterIssuer, Certificate (condition Ready) và
#   trust.cert-manager.io Bundle (G0-07, `argocd admin settings resource-overrides health`: Synced=True → Healthy,
#   Synced=False → Degraded kèm message lỗi).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-ca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
    targetRevision: main
    path: infra/lab-ca
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
