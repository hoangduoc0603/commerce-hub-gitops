# Keycloak Operator 26.8.2: đọc CR Keycloak (app keycloak, namespace keycloak) rồi dựng StatefulSet, Service, NetworkPolicy.
# Ticket G0-10. Chuẩn: docs/standards/keycloak.md mục "Cài trên Kubernetes bằng Operator". ADR-0004.
#
# - Wave 7: sau kube-prometheus-stack (6), vì Operator chỉ xét CRD ServiceMonitor lúc KHỞI ĐỘNG: CRD có sau thì không tạo
#   ServiceMonitor cho Keycloak tới lần restart kế (thấy ở G0-13: CRD 27/11 11:05, ServiceMonitor chỉ ra sau khi lab reboot
#   28/11 02:38). Trước wave 6 → 7 hai app cùng wave, dựng cụm trắng là đua nhau. Vẫn trước CR Keycloak (wave 8).
# - Không Helm: chart của Operator mới experimental (keycloak.md). Manifest vendor ở infra/keycloak-operator/upstream/.
# - ServerSideApply=true: CRD keycloaks (~520 KB) và keycloakrealmimports (~428 KB) vượt giới hạn 262 144 byte của
#   annotation last-applied-configuration khi apply phía client.
# - Project platform: có ClusterRole, ClusterRoleBinding, CRD (cluster-scoped). sourceRepos không đổi (chỉ repo gitops).
# - Lệch chuẩn có chủ đích (ADR-0004): operator 1 replica. Operator chết thì Keycloak đang chạy vẫn phục vụ; chỉ thay đổi
#   CR bị treo tới khi pod lên lại.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
    targetRevision: main
    path: infra/keycloak-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
