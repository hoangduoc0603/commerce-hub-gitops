# TẠM (ticket G0-03 bước 8–9, gỡ ở bước 11). Wave 2: chỉ được tạo sau khi sandbox-slow (wave 1) Healthy.
# Bước 9 dùng app này để đo self-heal (scale fast về 0) và prune (xóa ConfigMap prune-me khỏi Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-fast
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
    targetRevision: main
    path: sandbox/fast
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
