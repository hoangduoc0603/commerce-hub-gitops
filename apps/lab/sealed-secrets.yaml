# Sealed Secrets: secret chỉ vào Git dưới dạng SealedSecret (mã hóa bằng khóa công khai của controller),
# controller trong cụm giữ khóa private và sinh Secret. Argo CD không bao giờ thấy giá trị rõ.
# Ticket G0-04. Chuẩn: docs/standards/gitops-argocd.md, mục "Secret". Runbook khóa: docs/runbooks/sealing-key.md
# trong repo docs (sao lưu sau MỖI lần khóa gia hạn, khôi phục khi dựng lại cụm).
# Docs: https://github.com/bitnami/sealed-secrets (repo cũ bitnami-labs/sealed-secrets chuyển hướng về đây)
#
# - Wave 1: ngay sau app argocd (wave 0), trước cert-manager: ClusterIssuer lab-ca (G0-06) đọc Secret
#   lab-intermediate-ca, mà Secret đó đến từ một SealedSecret.
# - kube-system + tên sealed-secrets-controller: đúng mặc định của kubeseal, khỏi truyền --controller-name,
#   --controller-namespace mỗi lần; lệnh sao lưu khóa trong docs cũng giả định kube-system.
# - Có finalizer (app con của platform, theo chuẩn): xóa app thì dọn controller. Khóa sealing (Secret do controller
#   tự sinh, Argo CD không theo dõi) và CRD (Delete=false, xem infra/sealed-secrets/) KHÔNG bị xóa theo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    # Chart chính thức, ghim version cụ thể. Chart 2.22.0 = app 0.41.2 (version chart và app đánh số riêng).
    # Digest gói chart (index.yaml): sha256 1ed23bb224652aa6c8477979d4bddccd207205b27b12b120f62f360890c80606
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0
      helm:
        releaseName: sealed-secrets
        # CRD lấy từ source thứ hai (bản vendor có annotation bảo vệ).
        skipCrds: true
        valuesObject:
          fullnameOverride: sealed-secrets-controller
          image:
            # Ghim digest của image index đa kiến trúc (docs/standards/helm-chart.md "Image tham chiếu theo
            # digest"). Chart ghép registry/repository:tag nên digest đi trong tag.
            tag: 0.41.2@sha256:e63ec6ec2b12a471bf781081bd370a93ca7b7b3999e5b9243341379aeb801d0b
          # Ghi tường minh mặc định 30 ngày: lịch sao lưu khóa trong runbook dựa vào con số này.
          # Không đặt 0: tắt gia hạn không làm secret an toàn hơn (README "common misconceptions").
          keyrenewperiod: 720h
          # Memory theo ngân sách ADR-0004 (64 MiB), request = limit. Không CPU limit (tránh throttling).
          # Lệch có chủ đích so với resources-patch.yaml của Argo CD: chart tự đặt GOMEMLIMIT = limits.memory
          # (100%, resourceFieldRef) và không có value nào để đặt thấp hơn. Vẫn tốt hơn không đặt (Go biết trần);
          # heap của controller nhỏ (đo ở G0-04 bước 2). Đổi limit là GOMEMLIMIT đổi theo.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
    - repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
      targetRevision: main
      path: infra/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
