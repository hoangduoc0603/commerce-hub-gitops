# Sinh một Application cho mỗi service: thêm service = thêm thư mục envs/lab/<svc>/ có values.yaml.
# Chuẩn: docs/standards/gitops-argocd.md, mục "Cấu trúc Application: app-of-apps + ApplicationSet".
# Docs: https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Git/#git-generator-directories
#
# - `project: commerce` VIẾT CỨNG: CI của service ghi vào envs/ (ticket G0-24); nếu project lấy từ tham số,
#   ai ghi được vào envs/ sẽ đưa app vào project lỏng hơn.
#   https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Security/
# - Tên app có tiền tố `svc-`: tên Application là duy nhất trong namespace argocd; thư mục envs/lab/argocd/
#   không được sinh ra app trùng tên với app hạ tầng (vd. app argocd tự quản lý).
# - Chart version chung cho mọi service: nâng chart là một commit ở đây (CI của chart chạy `ct install`, G0-21).
# - Chưa chạy được đầu-cuối: chart app 0.1.0 publish ở G0-21; project commerce cho phép registry chart ở G0-24.
# - App sinh ra tự có finalizer resources-finalizer (preserveResourcesOnDeletion mặc định false): xóa thư mục
#   service là xóa app và resource của nó. Service không giữ dữ liệu (dữ liệu ở pg-main, thuộc platform).
# - Wave 100: root tạo ApplicationSet sau mọi app hạ tầng (wave 1–10).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-lab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  goTemplate: true
  # Tham số không tồn tại (gõ sai) thì báo lỗi, không thay bằng chuỗi rỗng.
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
        revision: main
        directories:
          - path: envs/lab/*
  template:
    metadata:
      name: 'svc-{{.path.basename}}'
    spec:
      project: commerce
      sources:
        # Chart dùng chung từ registry OCI của lab; Argo CD không nhận tiền tố oci:// ở đây.
        - repoURL: 10.20.0.5:5000/charts
          chart: app
          targetRevision: 0.1.0
          helm:
            releaseName: '{{.path.basename}}'
            valueFiles:
              - '$values/{{.path.path}}/values.yaml'
        # Chỉ cấp file values ($values = gốc repo gitops); source có ref không được có chart.
        - repoURL: https://github.com/hoangduoc0603/commerce-hub-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - PruneLast=true
          - FailOnSharedResource=true
