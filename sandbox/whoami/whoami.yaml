# App thử của G0-05: chứng minh đường Mac → Tailscale → gw → MetalLB (10.20.0.200) → Envoy → pod. Gỡ khi kết ticket.
# Namespace mang nhãn edge.lab.internal/routes, nên HTTPRoute ở đây gắn được vào Gateway edge.
apiVersion: v1
kind: Namespace
metadata:
  name: whoami
  labels:
    edge.lab.internal/routes: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami-typo
          # https://github.com/traefik/whoami, image index đa kiến trúc ghim digest.
          image: docker.io/traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          # Cổng > 1024 để chạy non-root.
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: whoami
spec:
  selector:
    app.kubernetes.io/name: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Vai trò "app developer": route tự khai hostname và backend, gắn vào listener http của Gateway edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - name: edge
      namespace: edge
      sectionName: http
  hostnames:
    - whoami.lab.internal
  rules:
    - backendRefs:
        - name: whoami-typo
          port: 80
