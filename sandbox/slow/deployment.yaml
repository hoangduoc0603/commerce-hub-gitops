# Workload "khởi động chậm": readinessProbe chỉ bắt đầu sau 60 giây, nên app sandbox-slow (wave 1)
# chỉ Healthy sau khoảng 60 giây. Dùng để chứng minh root app chờ wave 1 Healthy rồi mới tạo wave 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      # sleep chạy là PID 1, bỏ qua SIGTERM; không chờ 30 giây mặc định khi xóa pod.
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sleep
          image: busybox:1.37.0
          command: ["sleep", "604800"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 60
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
